stages:
  - build
  - deploy
  - test

variables:
  DVF_API_URL: "http://localhost:8080"
  # Share directory on the CI runner (mirrors the QEMU 9p share).
  # In production CI, this path must be available to the QEMU runner.
  SHARE_DIR: "/home/kartheekbudime/qemu-rootfs/share"
  # Configuration directory path (can be overridden to point to CDAC configurations)
  DVF_CONFIG_DIR: "go-orchestrator/configs"


# ---------------------------------------------------------------------------
# Build Go Orchestrator
# ---------------------------------------------------------------------------
build-orchestrator:
  stage: build
  image: golang:1.21-alpine
  script:
    - cd go-orchestrator
    - go build -v -o orchestrator ./cmd/orchestrator
    - go test -v ./...
  artifacts:
    paths:
      - go-orchestrator/orchestrator
    expire_in: 1 day

# ---------------------------------------------------------------------------
# Build C Test Binaries (existing DVF tests)
# ---------------------------------------------------------------------------
build-test-binaries:
  stage: build
  image: gcc:13-bookworm
  script:
    - apt-get update && apt-get install -y make
    - cd c-test-binaries
    - make -j4
  artifacts:
    paths:
      - c-test-binaries/
    expire_in: 1 day

# ---------------------------------------------------------------------------
# Build & Deploy Vishwa Artifacts to 9p Share
#
# This stage replicates what run_dvf_vishwa.sh steps 1-3 did manually:
#   Step 1: Build the GPGPU driver .ko
#   Step 2: Build the Vishwa test binaries
#   Step 3: Copy everything to the 9p share directory
#
# The orchestrator + guest agent handle step 4 (execution inside the VM).
# ---------------------------------------------------------------------------
deploy-vishwa:
  stage: deploy
  image: ubuntu:22.04
  needs:
    - build-orchestrator
  before_script:
    - apt-get update && apt-get install -y
        make gcc g++ linux-headers-generic
        python3 python3-pip python3-venv git
        cmake pkg-config
  script:
    # ---- Step 1: Build the GPGPU PCIe driver ----
    - echo "=== Building GPGPU driver ==="
    - make -C driver-source/gpgpu_driver -j4
    - ls -la driver-source/gpgpu_driver/gpgpu_pcie_ep_driver.ko

    # ---- Step 2: Build Vishwa test binaries ----
    # The Vishwa source is expected under test-suites/vishwa/.
    # Adjust the make target to match your Vishwa build system.
    - echo "=== Building Vishwa tests ==="
    - |
      if [ -f test-suites/vishwa/Makefile ]; then
        make -C test-suites/vishwa -j4
      elif [ -f test-suites/vishwa/build.sh ]; then
        bash test-suites/vishwa/build.sh
      else
        echo "WARN: No Vishwa build system found at test-suites/vishwa/ — skipping Vishwa build"
      fi

    # ---- Step 3: Copy artifacts to the 9p share ----
    - echo "=== Deploying artifacts to ${SHARE_DIR} ==="
    - mkdir -p "${SHARE_DIR}"

    # Driver .ko
    - cp driver-source/gpgpu_driver/gpgpu_pcie_ep_driver.ko "${SHARE_DIR}/"

    # Vishwa test tree
    - |
      if [ -d test-suites/vishwa/build ]; then
        mkdir -p "${SHARE_DIR}/vishwa_tests"
        cp -r test-suites/vishwa/build/. "${SHARE_DIR}/vishwa_tests/"
      fi

    # Agent bootstrap script (so it is available from the guest on first boot)
    - cp python-agent/agent/start_agent.sh "${SHARE_DIR}/"
    - chmod +x "${SHARE_DIR}/start_agent.sh"

    # Agent source + proto stubs (Option A: bundle via share, no rootfs changes)
    - mkdir -p "${SHARE_DIR}/python-agent"
    - cp -r python-agent/. "${SHARE_DIR}/python-agent/"

    # Pre-build a Python venv with grpcio into the share so the guest
    # can run the agent without any internet access or rootfs changes.
    # ponytail: if the rootfs already has grpcio (Option B), remove this block.
    - |
      if ! python3 -c "import grpc" 2>/dev/null; then
        python3 -m venv "${SHARE_DIR}/agent-venv"
        "${SHARE_DIR}/agent-venv/bin/pip" install --quiet grpcio protobuf
      else
        python3 -m venv "${SHARE_DIR}/agent-venv"
        "${SHARE_DIR}/agent-venv/bin/pip" install --quiet grpcio protobuf
      fi

    - echo "=== Deploy complete ==="
    - ls -la "${SHARE_DIR}/"

  artifacts:
    paths:
      - driver-source/gpgpu_driver/gpgpu_pcie_ep_driver.ko
    expire_in: 1 day

# ---------------------------------------------------------------------------
# Analyze Impact & Trigger Orchestration (existing job)
# ---------------------------------------------------------------------------
orchestrate-validation:
  stage: test
  image: python:3.11-slim
  needs:
    - build-orchestrator
    - deploy-vishwa
  before_script:
    - apt-get update && apt-get install -y git curl
  script:
    # 1. Start the orchestrator in the background using memory storage
    - ./go-orchestrator/orchestrator --config "$DVF_CONFIG_DIR" --storage memory > orchestrator.log 2>&1 &
    - ORCHESTRATOR_PID=$!
    
    # 2. Wait for the orchestrator REST API to become ready
    - echo "Waiting for orchestrator to start..."
    - |
      for i in {1..30}; do
        if curl -s http://localhost:8080/healthz > /dev/null; then
          echo "Orchestrator is ready!"
          break
        fi
        sleep 1
      done
      
    # 3. Check if the orchestrator process is still running
    - |
      if ! kill -0 $ORCHESTRATOR_PID 2>/dev/null; then
        echo "Orchestrator failed to start. Logs:"
        cat orchestrator.log
        exit 1
      fi
      
    # 4. Run the CI impact analyzer (without dry-run to execute tests)
    - echo "Running DVF CI Impact Analyzer..."
    - python3 scripts/ci_impact_analyzer.py
    - ANALYZER_EXIT_CODE=$?
    
    # 5. Clean up the orchestrator service
    - kill $ORCHESTRATOR_PID || true
    - exit $ANALYZER_EXIT_CODE
